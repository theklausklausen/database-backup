---
include:
  - project: 'klausklausen/templates'
    ref: main
    file: 'test.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'deploy.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'build.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'package.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'deploy.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'lint.yml'
  - project: 'klausklausen/templates'
    ref: main
    file: 'security.yml'
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  TAG: $CI_COMMIT_BRANCH
  GO_IMAGE: golang:1.23

stages:
  - security
  - lint
  - test
  - build
  - package
  - deploy
  - publish

# lint
markdown lint:
  extends: .markdown_lint
yaml lint:
  extends: .yaml_lint
prettier lint:
  extends: .prettier
helm lint:
  extends: .helm_lint
  variables:
    HELM_CHART_DIR: ./charts/*

# test
render helm chart:
  extends: .render_helm_chart
  variables:
    HELM_CHART_DIR: ./charts/*
  allow_failure: true

# security
secret_detection:
  stage: security
gitlab-advanced-sast:
  stage: security
dependency-scanning:
  stage: security
package_scan:
  extends: .package_scan
container_scan:
  extends: .container_scan
  allow_failure: true

# package
package helm:
  extends: .package_helm_chart
  variables:
    HELM_CHART_DIR: ./charts
    PACKAGE_NAME: ${CI_PROJECT_NAME}

# deploy
deploy helm:
  extends: .deploy_helm_chart
  variables:
    HELM_CHART_DIR: ./charts
    PACKAGE_NAME: ${CI_PROJECT_NAME}
